# yaml-language-server: $schema=https://raw.githubusercontent.com/yaklabco/gomdlint/main/docs/schema/gomdlint.schema.json
# gomdlint configuration
# See: https://github.com/yaklabco/gomdlint

# Markdown flavor: commonmark or gfm
flavor: gfm

# Default severity for all rules: error, warning, or info
# severity_default: error

# File patterns to ignore (glob patterns)
ignore:
  # Test data files - intentionally contain lint errors for testing
  - "pkg/lint/rules/testdata/**"
  - "internal/cli/testdata/**"

  # Common directories to ignore
  - "vendor/**"
  - "node_modules/**"
  - ".git/**"

# Rule-specific configuration
rules:
  MD048:
    enabled: true
    auto_fix: false  # Don't autofix - mixing ~~~ and ``` is valid for nested examples
    options:
      style: consistent  # Allow either ~~~ or ```, just be consistent
  MD010:
    enabled: true
    options:
      code_blocks: false  # Don't check tabs inside code blocks
  MD013:
    enabled: true
    options:
      max: 80
      # Prose wraps at 80 columns. Code blocks hold commands, program
      # output and diagrams, and table rows cannot wrap, so both are exempt.
      ignore_code_blocks: true
      ignore_tables: true
  MD024:
    options:
      # CHANGELOG.md repeats Added, Changed and Fixed under every release, as
      # Keep a Changelog does, so only headings under one parent must differ.
      siblings_only: true
  MD060:
    enabled: true
    options:
      style: compact
