name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs these checks before GoReleaser publishes anything.
  workflow_call:

permissions:
  contents: read

# A called workflow shares the caller's github.ref. release.yml must not
# declare a concurrency group with the same name, or GitHub cancels the
# run as a deadlock.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to lint a module whose toolchain is newer
          # than the Go release it was built with. v2.11.4 is built with
          # go1.26, which covers the go1.26.9 toolchain in go.mod.
          version: v2.11.4

      - name: Build
        run: go build -o /dev/null ./cmd/gomdlint

      - name: Lint Markdown docs
        run: go run ./cmd/gomdlint lint --strict README.md CHANGELOG.md CI_CD.md docs CLAUDE.md AGENTS.md

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum not tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Cross-compile
        run: |
          platforms=(
            "linux/amd64" "linux/arm64"
            "darwin/amd64" "darwin/arm64"
            "windows/amd64" "windows/arm64"
            "freebsd/amd64" "freebsd/arm64"
            "openbsd/amd64" "netbsd/amd64"
          )
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/gomdlint
            echo "✓ $platform"
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The test job saves the shared module cache.
          cache: false

      # Fails when this module's code reaches a known vulnerability in a
      # dependency or in the standard library of the go.mod toolchain.
      # Keep the version in step with CI.Vuln in stavefile.go and the
      # pinned tool versions in CI_CD.md.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
